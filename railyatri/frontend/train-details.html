<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailYatri - Train Details</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .timeline {
            border-left: 2px solid var(--border-color);
            margin-left: 10px;
            padding-left: 20px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary-color);
        }
        .fare-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <a href="javascript:history.back()" class="back-btn">←</a>
            <h1>Train Details</h1>
            <div style="width: 24px;"></div>
        </header>

        <div id="detailsContainer">
            <div class="text-center mt-4 text-muted">Loading details...</div>
        </div>

    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const trainNo = getQueryParam('trainNo');
            if(trainNo) {
                fetchTrainDetails(trainNo);
            } else {
                window.location.href = 'index.html';
            }
        });

        async function fetchTrainDetails(trainNo) {
            try {
                const response = await fetch(`${API_BASE_URL}/trains/${trainNo}`);
                const train = await response.json();
                
                let scheduleHtml = '';
                if(train.schedule) {
                    train.schedule.forEach((st, idx) => {
                        let timeInfo = '';
                        if(idx === 0) timeInfo = `Dep: ${st.departureTime}`;
                        else if(idx === train.schedule.length - 1) timeInfo = `Arr: ${st.arrivalTime}`;
                        else timeInfo = `Arr: ${st.arrivalTime} | Dep: ${st.departureTime}`;
                        
                        scheduleHtml += `
                            <div class="timeline-item">
                                <div class="fw-bold">${st.arrivalTime === '-' ? st.departureTime : st.arrivalTime} <span style="margin-left: 10px; font-weight: normal;">${st.name} (${st.code})</span></div>
                                <div style="font-size: 0.8rem;" class="text-muted">${timeInfo}</div>
                            </div>
                        `;
                    });
                }

                let faresHtml = '';
                if (train.classes) {
                    train.classes.forEach(cls => {
                        let statusColor = "var(--success-color)";
                        let statusText = "Available " + cls.availableSeats;
                        if (cls.status === "RAC") {
                            statusColor = "orange";
                            statusText = "RAC " + cls.currentRac;
                        } else if (cls.status === "WAITING") {
                            statusColor = "red";
                            statusText = "WL " + cls.currentWaitingList;
                        }
                        
                        let prob = cls.confirmationProbability;
                        let probColor = prob > 80 ? 'green' : (prob > 50 ? 'orange' : 'red');

                        faresHtml += `
                            <div class="fare-card" style="display: block;">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div class="fw-bold" style="background: #e3f2fd; padding: 4px 8px; border-radius: 4px; color: var(--primary-color);">${cls.className}</div>
                                    <div class="fw-bold">₹${cls.fare}</div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div style="color: ${statusColor}; font-weight: bold; font-size: 0.9rem;">${statusText}</div>
                                </div>
                                <div class="mt-2" style="font-size: 0.8rem; border-top: 1px dashed var(--border-color); padding-top: 5px;">
                                    <div class="d-flex justify-content-between">
                                        <span>Confirmation Probability:</span>
                                        <span style="color: ${probColor}; font-weight: bold;">${prob}%</span>
                                    </div>
                                    <div style="height: 6px; background: #e9ecef; border-radius: 3px; margin-top: 4px; overflow: hidden;">
                                        <div style="height: 100%; width: ${prob}%; background-color: ${probColor};"></div>
                                    </div>
                                </div>
                                <div class="mt-2 text-right">
                                    <button class="btn btn-primary" style="padding: 4px 12px; font-size: 0.85rem;" onclick="selectTrainClass('${train.trainNumber}', '${cls.className}')">Book ${cls.className}</button>
                                </div>
                            </div>
                        `;
                    });
                }

                document.getElementById('detailsContainer').innerHTML = `
                    <div style="height: 120px; background-color: #8bb3e8; display: flex; align-items: flex-end; padding: 15px;">
                        <h2 style="color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">${train.trainNumber} ${train.trainName}</h2>
                    </div>
                    
                    <div class="card" style="margin-top: -20px;">
                        <div class="d-flex justify-content-between mb-2">
                            <div><span class="text-muted">Runs On:</span> ${train.runningDays.join(', ')}</div>
                            <div><span class="text-muted">Duration:</span> ${train.duration}</div>
                        </div>
                        
                        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 15px 0;">
                        
                        <h3 style="font-size: 1rem; margin-bottom: 15px;">Complete Timing</h3>
                        <div class="timeline">
                            ${scheduleHtml}
                        </div>
                        
                        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 15px 0;">
                        
                        <h3 style="font-size: 1rem; margin-bottom: 15px;">Available Classes & Fare</h3>
                        ${faresHtml}
                        <div style="font-size: 0.7rem; color: #666; margin-top: 5px; text-align: center;">
                            * Estimated probability based on demo data. This is not a real-time railway confirmation prediction.
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                document.getElementById('detailsContainer').innerHTML = '<div class="card text-danger">Error loading train details</div>';
            }
        }

        function selectTrainClass(trainNo, className) {
            localStorage.setItem('selected_train', trainNo);
            localStorage.setItem('selected_class', className);
            window.location.href = 'passenger.html';
        }
    </script>
</body>
</html>
