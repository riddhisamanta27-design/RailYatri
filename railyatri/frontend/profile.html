<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailYatri - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px 20px 40px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            color: var(--primary-color);
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-weight: bold;
        }
        .menu-list {
            margin-top: -20px;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }
        .menu-item {
            background: var(--secondary-color);
            padding: 18px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-decoration: none;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        .menu-item:hover {
            background: #f8f9fa;
        }
        .logout-btn {
            color: var(--danger-color);
            border-color: #f5c6cb;
            background-color: #f8d7da;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="profile-header">
            <div class="avatar">AS</div>
            <h2>Aarav Sharma</h2>
            <div style="font-size: 0.9rem; opacity: 0.8;">aarav@example.com</div>
        </div>

        <div class="menu-list">
            <a href="#" class="menu-item">
                <span>👤 My Information</span>
                <span class="text-muted">></span>
            </a>
            <a href="#" class="menu-item">
                <span>👥 Saved Passengers</span>
                <span class="text-muted">></span>
            </a>
            <a href="bookings.html" class="menu-item">
                <span>📅 My Bookings</span>
                <span class="text-muted">></span>
            </a>
            <a href="#" class="menu-item">
                <span>⚙️ Settings</span>
                <span class="text-muted">></span>
            </a>
            <a href="#" class="menu-item">
                <span>❓ Help & Support</span>
                <span class="text-muted">></span>
            </a>
            
            <a href="#" class="menu-item logout-btn mt-4" onclick="alert('Logged out successfully'); window.location.href='index.html'">
                <span>↪️ Logout</span>
            </a>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><span>🏠</span>Home</a>
            <a href="bookings.html" class="nav-item"><span>📅</span>My Bookings</a>
            <a href="profile.html" class="nav-item active"><span>👤</span>Profile</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
