<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailYatri - Booking Confirmation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .conf-header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 30px 20px 50px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .success-icon {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--success-color);
            margin: 0 auto 15px;
        }
        .pnr-card {
            background: white;
            margin: -30px 20px 20px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .dashed-divider {
            border-top: 1px dashed var(--border-color);
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="app-container" style="background-color: var(--bg-light); min-height: 100vh; padding-bottom: 20px;">
        <div class="conf-header">
            <div class="success-icon">✓</div>
            <h2>Booking Successful!</h2>
            <p style="font-size: 0.85rem; opacity: 0.9;">Your ticket has been booked successfully.</p>
        </div>

        <div class="pnr-card">
            <div class="text-muted" style="font-size: 0.85rem; margin-bottom: 5px;">PNR Number</div>
            <div class="fw-bold" style="font-size: 1.5rem; letter-spacing: 2px;" id="pnrNumber">Loading...</div>
        </div>

        <div class="card" id="ticketDetails">
            <div class="text-center text-muted">Loading ticket details...</div>
        </div>

        <div style="padding: 0 15px;">
            <button class="btn btn-primary mb-2" onclick="alert('Ticket downloaded!')">Download / View Ticket</button>
            <button class="btn btn-outline mb-2" onclick="window.location.href='index.html'">Back to Home</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const pnr = localStorage.getItem('last_booking_pnr');
            if(!pnr) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('pnrNumber').textContent = pnr;

            try {
                const response = await fetch(`${API_BASE_URL}/bookings/${pnr}`);
                const booking = await response.json();
                
                let passengersHtml = '';
                booking.passengers.forEach((p, idx) => {
                    passengersHtml += `
                        <div class="d-flex justify-content-between align-items-center mb-2" style="font-size: 0.9rem;">
                            <div>${idx + 1}. ${p.name} <span class="text-muted">(${p.age} | ${p.gender.charAt(0)})</span></div>
                            <div>
                                <span class="fw-bold text-success">${p.status}</span>
                                <span style="margin-left: 10px;" class="fw-bold">${p.seatNumber}</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('ticketDetails').innerHTML = `
                    <h3 style="font-size: 1rem; margin-bottom: 10px;">Train Details</h3>
                    <div class="fw-bold">${booking.train.trainNumber}  ${booking.train.trainName}</div>
                    <div style="font-size: 0.85rem;" class="text-muted mb-1">${booking.train.source} → ${booking.train.destination}</div>
                    <div style="font-size: 0.85rem;" class="text-muted mb-2">Class: <span class="fw-bold">${booking.trainClass}</span> | Booking Probability: <span class="fw-bold">${booking.probabilityAtBooking}%</span></div>
                    
                    <div class="d-flex justify-content-between mt-3">
                        <div>
                            <div class="text-muted" style="font-size: 0.8rem;">Departure</div>
                            <div class="fw-bold">${booking.train.departureTime}</div>
                            <div style="font-size: 0.8rem;">${new Date(booking.journeyDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
                        </div>
                        <div class="text-right" style="text-align: right;">
                            <div class="text-muted" style="font-size: 0.8rem;">Arrival</div>
                            <div class="fw-bold">${booking.train.arrivalTime}</div>
                        </div>
                    </div>
                    
                    <div class="dashed-divider"></div>
                    
                    <h3 style="font-size: 1rem; margin-bottom: 10px;">Passenger Details</h3>
                    ${passengersHtml}
                `;
            } catch(e) {
                console.error(e);
                document.getElementById('ticketDetails').innerHTML = '<div class="text-danger text-center">Failed to load booking details</div>';
            }
        });
    </script>
</body>
</html>
