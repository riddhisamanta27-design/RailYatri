<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailYatri - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="d-flex align-items-center">
                <!-- Use simple SVG/emoji for logo -->
                <span style="font-size: 1.5rem; margin-right: 10px;">🚆</span>
                <div>
                    <h1>RailYatri</h1>
                    <span style="font-size: 0.7rem;">Your Journey Made Easy</span>
                </div>
            </div>
        </header>

        <!-- Hero image placeholder / illustration space -->
        <div style="background-color: #8bb3e8; height: 120px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; display: flex; align-items: center; justify-content: center; color: white;">
            <h2>Book Your Train Ticket</h2>
        </div>

        <!-- Search Card -->
        <div class="card" style="margin-top: -30px; position: relative; z-index: 10;">
            <form id="searchForm" onsubmit="handleSearch(event)">
                <div class="form-group">
                    <label class="form-label">From</label>
                    <input type="text" id="source" class="form-control" placeholder="e.g., MMCT or Mumbai Central" required>
                    <div id="sourceError"></div>
                </div>
                <div class="text-center mb-2">
                    <span style="cursor:pointer; color: var(--primary-color);" onclick="swapStations()">⇅ Swap</span>
                </div>
                <div class="form-group">
                    <label class="form-label">To</label>
                    <input type="text" id="destination" class="form-control" placeholder="e.g., NDLS or New Delhi" required>
                    <div id="destError"></div>
                </div>
                <div class="d-flex justify-content-between">
                    <div class="form-group" style="width: 48%;">
                        <label class="form-label">Date</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <div class="form-group" style="width: 48%;">
                        <label class="form-label">Class</label>
                        <select id="classType" class="form-control">
                            <option value="SL">Sleeper (SL)</option>
                            <option value="3A">Third AC (3A)</option>
                            <option value="2A">Second AC (2A)</option>
                            <option value="1A">First AC (1A)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Search Train</button>
            </form>
        </div>

        <!-- Quick Access -->
        <div style="padding: 0 15px;">
            <h3 style="font-size: 1rem; margin-bottom: 10px;">Quick Access</h3>
            <div class="d-flex justify-content-between">
                <a href="pnr.html" class="card text-center" style="margin: 0; width: 30%; text-decoration: none;">
                    <div style="font-size: 1.5rem; color: #17a2b8;">🎫</div>
                    <div style="font-size: 0.8rem; margin-top: 5px;">PNR Status</div>
                </a>
                <a href="live-status.html" class="card text-center" style="margin: 0; width: 30%; text-decoration: none;">
                    <div style="font-size: 1.5rem; color: var(--success-color);">📍</div>
                    <div style="font-size: 0.8rem; margin-top: 5px;">Live Status</div>
                </a>
                <a href="schedule.html" class="card text-center" style="margin: 0; width: 30%; text-decoration: none;">
                    <div style="font-size: 1.5rem; color: #6f42c1;">🕒</div>
                    <div style="font-size: 0.8rem; margin-top: 5px;">Schedule</div>
                </a>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <span>🏠</span>
                Home
            </a>
            <a href="bookings.html" class="nav-item">
                <span>📅</span>
                My Bookings
            </a>
            <a href="profile.html" class="nav-item">
                <span>👤</span>
                Profile
            </a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;
        document.getElementById('date').value = '2026-04-26'; // Default as per requirements for demo

        function swapStations() {
            const src = document.getElementById('source');
            const dest = document.getElementById('destination');
            const temp = src.value;
            src.value = dest.value;
            dest.value = temp;
        }

        function handleSearch(e) {
            e.preventDefault();
            const src = document.getElementById('source').value.trim();
            const dest = document.getElementById('destination').value.trim();
            const date = document.getElementById('date').value;
            const cls = document.getElementById('classType').value;

            clearError('sourceError');
            clearError('destError');

            if (src.toLowerCase() === dest.toLowerCase()) {
                showError('destError', 'Source and destination cannot be same');
                return;
            }

            // Save search params to localStorage
            localStorage.setItem('search_src', src);
            localStorage.setItem('search_dest', dest);
            localStorage.setItem('search_date', date);
            localStorage.setItem('search_class', cls);

            window.location.href = `trains.html?source=${src}&destination=${dest}`;
        }
    </script>
</body>
</html>
